# Pre-commit hooks for hop. Install with `pre-commit install`, run on demand
# with `pre-commit run --all-files`.
#
# Requires two binaries already on PATH (both use pre-commit's `system`
# language, so pre-commit installs nothing for them):
#   - betterleaks (brew install betterleaks)
#   - opengrep    (see https://github.com/opengrep/opengrep/blob/main/install.sh)
#
# Opengrep coverage for Swift is thin, so it runs a small vendored pack:
# the project's own Swift rules plus opengrep's generic secrets patterns
# (from opengrep/opengrep-rules @ f1d2b562b414783763fd02a6ed2736eaed622efa,
# under .opengrep/rules), as a second layer behind betterleaks, which is the
# main gate here.
exclude: '^\.opengrep/'
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/betterleaks/betterleaks
    rev: v1.8.1
    hooks:
      - id: betterleaks-system
        name: betterleaks (secrets scan, staged files)

  - repo: https://github.com/opengrep/opengrep
    rev: v1.30.0
    hooks:
      - id: semgrep
        name: opengrep (SAST, pinned Swift + generic-secrets rules)
        types: [swift]
        args:
          - --config
          - .opengrep/rules
          - --error
          - --quiet
          - --skip-unknown-extensions
          - --disable-version-check
